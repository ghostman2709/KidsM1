<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mendieta.Cloud · Backup</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #050505;
        color: #eaeaea;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .card {
        background: #0d0d0d;
        border: 1px solid #1a1a1a;
        border-radius: 18px;
        padding: 28px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 0 50px rgba(0,0,0,.9);
    }

    h1 {
        margin: 0 0 22px;
        font-size: 20px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #ffffff;
        text-align: center;
    }

    .line {
        margin-bottom: 14px;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid #1c1c1c;
        padding-bottom: 8px;
        flex-wrap: wrap;
    }

    .label {
        color: #777;
        min-width: 110px;
    }

    .value {
        font-weight: 600;
        color: #fff;
        text-align: right;
        word-break: break-all;
        flex: 1;
    }

    .status-ok {
        color: #00ff9c;
    }

    .status-fail {
        color: #ff4d4d;
    }

    footer {
        margin-top: 20px;
        font-size: 11px;
        color: #555;
        text-align: center;
        letter-spacing: 1px;
    }

    @media (max-width: 380px) {
        h1 {
            font-size: 18px;
        }
        .label {
            min-width: 90px;
            font-size: 13px;
        }
        .value {
            font-size: 13px;
        }
    }
</style>
</head>

<body>

<div class="card">
    <h1>Mendieta.Cloud</h1>

    <div class="line">
        <span class="label">Último Backup</span>
        <span class="value" id="ultimo">--</span>
    </div>

    <div class="line">
        <span class="label">Tamanho</span>
        <span class="value" id="tamanho">--</span>
    </div>

    <div class="line">
        <span class="label">Servidor</span>
        <span class="value" id="servidor">--</span>
    </div>

    <div class="line">
        <span class="label">Pasta</span>
        <span class="value" id="pasta">--</span>
    </div>

    <div class="line">
        <span class="label">Status</span>
        <span class="value" id="status">--</span>
    </div>

    <footer>
        Backup automático · Mendieta.Cloud
    </footer>
</div>

<script>
fetch("status.json")
.then(r => r.json())
.then(data => {
    document.getElementById("ultimo").innerText = data.ultimo_backup;
    document.getElementById("tamanho").innerText = data.tamanho;
    document.getElementById("servidor").innerText = data.servidor;
    document.getElementById("pasta").innerText = data.pasta;

    const status = document.getElementById("status");
    status.innerText = data.status;

    status.classList.add(
        data.status === "OK" ? "status-ok" : "status-fail"
    );
})
.catch(() => {
    const status = document.getElementById("status");
    status.innerText = "ERRO";
    status.classList.add("status-fail");
});
</script>

</body>
</html>
