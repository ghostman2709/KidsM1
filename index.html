<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Drive Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#000;
  color:#0ff;
  font-family:'Orbitron',sans-serif;
}

.wrapper{
  padding:20px;
}

input{
  width:100%;
  padding:14px;
  background:#050b12;
  border:1px solid #00f0ff;
  color:#00f0ff;
  outline:none;
  font-size:14px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  background:#00f0ff;
  color:#000;
  font-weight:600;
  border:none;
  cursor:pointer;
  box-shadow:0 0 15px #00f0ff;
}

button:hover{
  background:#00c8ff;
}

#viewer{
  margin-top:20px;
  width:100%;
  height:75vh;
  border:1px solid #00f0ff;
  box-shadow:0 0 25px rgba(0,255,255,.3);
  display:none;
}

.msg{
  margin-top:15px;
  color:#ff4d6d;
}
</style>
</head>

<body>

<div class="wrapper">

  <input id="link" value="https://drive.google.com/drive/folders/19QolU4GRQ9ebv77dBYVOdojiBuNkWGZs">
  <button onclick="loadFolder()">CARREGAR PASTA</button>

  <div id="msg" class="msg"></div>

  <iframe id="viewer"></iframe>

</div>

<script>
function loadFolder(){
  const link = document.getElementById('link').value.trim();
  const msg = document.getElementById('msg');
  const viewer = document.getElementById('viewer');

  const match = link.match(/folders\/([a-zA-Z0-9_-]+)/);

  if(!match){
    msg.innerText = 'Link inválido';
    viewer.style.display = 'none';
    return;
  }

  const folderId = match[1];

  const embedUrl = `https://drive.google.com/embeddedfolderview?id=${folderId}#grid`;

  viewer.src = embedUrl;
  viewer.style.display = 'block';
  msg.innerText = '';
}
</script>

</body>
</html>
