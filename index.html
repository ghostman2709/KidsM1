<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Hyper Foco · Backup</title>

<style>
    body {
        margin: 0;
        background: #0b0b0b;
        color: #eaeaea;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .card {
        background: #111;
        border: 1px solid #222;
        border-radius: 14px;
        padding: 30px 40px;
        width: 420px;
        box-shadow: 0 0 40px rgba(0,0,0,.8);
    }

    h1 {
        margin: 0 0 20px;
        font-size: 22px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #ffffff;
    }

    .line {
        margin-bottom: 14px;
        font-size: 15px;
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #1d1d1d;
        padding-bottom: 6px;
    }

    .label {
        color: #888;
    }

    .value {
        font-weight: 600;
        color: #fff;
    }

    .status-ok {
        color: #00ff9c;
    }

    .status-fail {
        color: #ff4d4d;
    }

    footer {
        margin-top: 25px;
        font-size: 12px;
        color: #555;
        text-align: center;
        letter-spacing: 1px;
    }
</style>
</head>

<body>

<div class="card">
    <h1>Hyper Foco Backup</h1>

    <div class="line">
        <span class="label">Último Backup</span>
        <span class="value" id="ultimo">--</span>
    </div>

    <div class="line">
        <span class="label">Tamanho</span>
        <span class="value" id="tamanho">--</span>
    </div>

    <div class="line">
        <span class="label">Servidor</span>
        <span class="value" id="servidor">--</span>
    </div>

    <div class="line">
        <span class="label">Pasta</span>
        <span class="value" id="pasta">--</span>
    </div>

    <div class="line">
        <span class="label">Status</span>
        <span class="value" id="status">--</span>
    </div>

    <footer>
        Hyper Foco · Backup automático diário
    </footer>
</div>

<script>
fetch("status.json")
.then(r => r.json())
.then(data => {
    document.getElementById("ultimo").innerText = data.ultimo_backup;
    document.getElementById("tamanho").innerText = data.tamanho;
    document.getElementById("servidor").innerText = data.servidor;
    document.getElementById("pasta").innerText = data.pasta;

    const status = document.getElementById("status");
    status.innerText = data.status;

    status.classList.add(
        data.status === "OK" ? "status-ok" : "status-fail"
    );
})
.catch(() => {
    document.getElementById("status").innerText = "ERRO";
    document.getElementById("status").classList.add("status-fail");
});
</script>

</body>
</html>
